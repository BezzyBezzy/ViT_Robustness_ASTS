experiment:
  name: asts_deit_base_cifar10__ce_adv_only
  seed: 42
  output_root: outputs
  device: auto   # auto|cpu|cuda

data:
  dataset: cifar10      # cifar10|cifar100|imagenet1k
  image_size: 224
  batch_size: 64
  num_workers: 4
  val_split: 0.1
  imagenet_dir: null    # required if dataset=imagenet1k
  train_ratio: 1.0      # Ratio of training data (stratified sampling, preserves class distribution)
  eval_ratio: 1.0       # Ratio of test/val data (stratified sampling, preserves class distribution)

model:
  hf_model_id: nateraw/vit-base-patch16-224-cifar10
  use_safetensors: true
  num_labels: 10
  normalize:
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]

asts:
  enabled: true
  parameterization: exp   # exp|softplus
  init_temperature: 1.0
  eps: 1.0e-6

trainable:
  train_temperatures: true
  train_classifier_head: true
  train_layernorm: false
  train_backbone: false

objective:
  lambda_attn: 0.5
  ce_mode: mixed             # adv_only|clean_only|mixed (mixed preserves clean accuracy)
  beta_clean: 0.5            # 50% clean + 50% adversarial CE loss
  attn_divergence_mode: kl   # kl|js (js = symmetric Jensen-Shannon divergence)
  temperature_reg:
    enabled: false
    weight: 0.0
    target: 1.0
    clamp_min: 0.1
    clamp_max: 10.0
  trades:                    # TRADES-style logit KL loss (recommended for robustness)
    enabled: true
    lambda: 6.0              # Weight for TRADES loss (default from paper: 6.0)
    temperature: 1.0         # Temperature for softmax in KL computation
  attn_entropy:              # Attention entropy regularization (prevents collapse)
    enabled: false
    weight: 0.1
    target: 2.0              # Target entropy (higher = more uniform attention)
  layer_weighting:           # Per-layer attention loss weighting
    mode: linear             # uniform|linear|exponential (later layers weighted more)
    base: 1.5                # Base for exponential mode

training:
  epochs: 20
  lr: 5.0e-4
  weight_decay: 0.01
  grad_clip_norm: 1.0
  log_every_steps: 50
  eval_every_epochs: 1
  save_every_epochs: 1
  eval_baseline_before_train: true
  use_amp: true  # Mixed precision training (FP16 on CUDA)
  torch_compile: false  # Enable torch.compile() for PyTorch 2.0+ (experimental)
  torch_compile_mode: reduce-overhead  # compile mode: default|reduce-overhead|max-autotune

attacks:
  train:
    attacks:
      # --- Phase 1: Warmup with weak PGD ---
      - name: pgd
        epochs: 4
        params:
          norm: linf
          eps: 0.015686   # 4/255
          alpha: 0.003922 # 1/255
          steps: 7
          random_start: true

      # --- Phase 2: Medium PGD ---
      - name: pgd
        epochs: 5
        params:
          norm: linf
          eps: 0.023529   # 6/255
          alpha: 0.003922 # 1/255
          steps: 10
          random_start: true

      # --- Phase 3: Full strength PGD ---
      - name: pgd
        epochs: 6
        params:
          norm: linf
          eps: 0.031373   # 8/255
          alpha: 0.003922 # 1/255
          steps: 20
          random_start: true

      # --- Phase 4: CW attack (improves generalization to different attacks) ---
      - name: cw
        epochs: 5
        params:
          norm: linf
          eps: 0.031373   # 8/255
          steps: 15
          random_start: true

  eval:
    enabled: true
    attacks:
      # --- PGD-20 (L_inf, eps=8/255) ---
      - name: pgd
        params:
          norm: linf
          eps: 0.031373
          alpha: 0.007843
          steps: 20
          random_start: true

      # --- PGD-100 (L_inf, eps=8/255) ---
      - name: pgd
        params:
          norm: linf
          eps: 0.031373
          alpha: 0.003922
          steps: 100
          random_start: true

      # --- CW-20 (L_inf, eps=8/255) ---
      - name: cw
        params:
          norm: linf
          eps: 0.031373
          steps: 20
          random_start: true

      # --- AutoAttack (L_inf, eps=8/255) ---
      - name: autoattack
        params:
          norm: linf
          eps: 0.031373
          version: standard
